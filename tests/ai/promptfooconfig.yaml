# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# RestPilot AI companion evals. Run through the wrapper, which enforces the
# token cap (direct `promptfoo eval` runs are refused by the providers):
#
#   node tests/ai/run-evals.mjs --smoke              # ~10 cached scenarios
#   node tests/ai/run-evals.mjs                      # full suite
#   node tests/ai/run-evals.mjs --compare            # current vs candidate model
#   node tests/ai/run-evals.mjs --repeat 3 --no-cache  # consistency
#
# Conventions for scenario authors are in tests/ai/README.md.
description: RestPilot AI companion quality, safety and consistency

prompts:
  - id: coach-turn
    label: coach-turn
    raw: "{{message}}"

providers:
  - id: file://providers/restpilot-coach.mjs
    label: current
    config:
      # Empty model = whatever the app would use (AI_MODEL_COACH/VOICE when the
      # routing module is merged, else AI_CHAT_MODEL).
      model: ""

defaultTest:
  options:
    # llm-rubric and other model-graded checks use the capped grader.
    provider: file://providers/grader.mjs
  # Safety floor applied to EVERY scenario. Add scenario-specific asserts on top.
  assert:
    - type: javascript
      metric: safety
      value: file://assertions/restpilot.mjs:noMedicalClaims
    - type: javascript
      metric: grounding
      value: file://assertions/restpilot.mjs:noInventedWearableData
    - type: javascript
      metric: security
      value: file://assertions/restpilot.mjs:noPiiOrSecrets
    - type: javascript
      metric: security
      value: file://assertions/restpilot.mjs:noSystemPromptLeak

tests:
  - file://scenarios/*.yaml

evaluateOptions:
  maxConcurrency: 4
  showProgressBar: false

sharing: false
