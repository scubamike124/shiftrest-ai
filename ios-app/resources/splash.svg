<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!--
    RestPilot launch image (source). The storyboard shows it "aspect fill", so a
    portrait iPhone only sees the middle ~45% of the width: the mark stays inside
    the central 900px. No text, per Apple's launch-screen guidance. The flat
    background (#0b1020) matches the WebView background and the shell's
    SplashScreen colour, so the hand-off to the page does not flash.
  -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d63ff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#f4f3ff"/>
      <stop offset="0.5" stop-color="#cfcbff"/>
      <stop offset="1" stop-color="#8f86ff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f86ff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#a9a3ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e9e7ff" stop-opacity="1"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="2732" height="2732" fill="black"/>
      <circle cx="1346" cy="1386" r="200" fill="white"/>
      <circle cx="1444" cy="1307" r="173" fill="black"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="2732" height="2732" fill="#0b1020"/>
  <circle cx="1366" cy="1366" r="560" fill="url(#halo)"/>
  <g mask="url(#crescent)" filter="url(#glow)" opacity="0.6">
    <rect width="2732" height="2732" fill="#8f86ff"/>
  </g>
  <rect width="2732" height="2732" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M 1411 1464 C 1474 1426 1527 1344 1549 1232" fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="1549" cy="1232" r="22" fill="#ffffff"/>
</svg>
