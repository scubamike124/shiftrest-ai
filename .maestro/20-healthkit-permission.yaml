appId: com.restpilotai.app
name: Connect Apple Health shows the HealthKit permission sheet (read-only), declined here
tags: [healthkit]
---
# Runs only when the build declares HealthKit (PR #17). The sheet is the system
# "Health Access" screen; the flow declines so nothing is shared.
- launchApp
- extendedWaitUntil:
    visible: "Profile"
    timeout: 90000
# The bottom nav is visible in the server-rendered HTML before the page hydrates,
# and a tap that lands first does nothing (CI run 43750694354: the tap was
# accepted, the screen stayed on Home). Retry until the Profile page is up.
- retry:
    maxRetries: 4
    commands:
      - tapOn: "Profile"
      - extendedWaitUntil:
          visible: "Your preferences"
          timeout: 15000
- scrollUntilVisible:
    element:
      text: "Connect Apple Health"
    direction: DOWN
    # Profile is long (voices, personality, settings); scroll faster and longer.
    speed: 80
    timeout: 120000
# The system Health privacy service starts slowly on a fresh hosted simulator, and
# HealthKit fails each authorization request after ~10 s while it is down. CI run
# 43691170744 needed 2 taps; run 43759122862 (attempt 2) needed more: both taps
# logged "FAILED prompting authorization" (21:21:33 and 21:22:12) and the service
# only came up at 21:23:05, seconds after the flow gave up. The app asked
# correctly every time. Tap Connect again until the sheet shows; the final
# assertion below is unchanged and still fails the flow if it never appears.
- retry:
    maxRetries: 5
    commands:
      - runFlow:
          when:
            notVisible:
              text: "(Health Access|Turn On All|Allow .* to read)"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Connect Apple Health"
                direction: DOWN
                timeout: 30000
            - tapOn: "Connect Apple Health"
      - extendedWaitUntil:
          visible:
            text: "(Health Access|Turn On All|Allow .* to read)"
          timeout: 25000
- extendedWaitUntil:
    visible:
      text: "(Health Access|Turn On All|Allow .* to read)"
    timeout: 60000
- takeScreenshot: maestro-20-healthkit-sheet
- tapOn:
    text: "Don.t Allow"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
