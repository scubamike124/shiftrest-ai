appId: com.restpilotai.app
name: Sign-in screen in the app shell (no Google button, no Safari install prompt)
tags: [core]
---
- launchApp
# On iPhone widths "Sign in" sits in the header menu.
- extendedWaitUntil:
    visible: "Open menu"
    timeout: 45000
- tapOn: "Open menu"
- tapOn:
    text: "Sign in"
    index: 0
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 20000
- assertVisible: "Email address"
- assertVisible: "Forgot Password?"
# PR #6: Google sign-in is hidden inside the iPhone app (blocked in WebViews).
- assertNotVisible: "Continue with Google"
- assertNotVisible: "Add to Home Screen"
- takeScreenshot: maestro-02-sign-in
