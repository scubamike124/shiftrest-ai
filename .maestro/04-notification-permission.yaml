appId: com.restpilotai.app
name: Turning on iPhone reminders shows the iOS notification permission prompt
tags: [core]
---
# Assumes 03 left the app signed in (Maestro keeps app state between flows).
- launchApp
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Reminders on this iPhone"
    direction: DOWN
    timeout: 30000
- takeScreenshot: maestro-04-reminders-card
- tapOn:
    text: "Reminders on this iPhone"
    index: 1
# The system alert ("“RestPilot” Would Like to Send You Notifications").
- extendedWaitUntil:
    visible: "Allow"
    timeout: 15000
- takeScreenshot: maestro-04-permission-alert
- tapOn: "Allow"
- extendedWaitUntil:
    visible:
      text: "(Next: .*|Add your shifts to get reminders\\.|Nothing in the next 7 days.*)"
    timeout: 15000
- takeScreenshot: maestro-04-reminders-on
