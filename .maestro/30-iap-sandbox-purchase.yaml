appId: com.restpilotai.app
name: Apple sandbox purchase of the monthly plan (BLOCKED)
tags: [blocked, iap]
---
# BLOCKED until: App Store Connect products (monthly $7.99, annual $49.99 with a
# 14-day trial) exist, a Sandbox Apple Account is created, and the subscriptions
# work (PR #16) ships StoreKit purchase UI. With a .storekit configuration file
# the same flow can run against StoreKit Testing in the simulator instead.
- launchApp
- extendedWaitUntil:
    visible: "Profile"
    timeout: 45000
- tapOn: "App preview"
- tapOn:
    text: "(Monthly|\\$7\\.99).*"
- extendedWaitUntil:
    visible:
      text: "(Subscribe|Confirm|\\[Environment: Sandbox\\]|Sandbox).*"
    timeout: 30000
- takeScreenshot: maestro-30-iap-sheet
- tapOn:
    text: "(Subscribe|Confirm)"
- extendedWaitUntil:
    visible:
      text: "(You're all set|Subscribed|Active).*"
    timeout: 60000
