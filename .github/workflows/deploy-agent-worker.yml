name: Deploy LiveKit Agent Worker

# Deploys agent-worker/ to LiveKit Cloud whenever its source changes on the
# default branch. Also runnable on-demand via the "Run workflow" button in
# the GitHub Actions UI. Sync marker: agent id resolved from `lk agent list`.
on:
  push:
    branches: [main]
    paths:
      - 'agent-worker/**'
      - '.github/workflows/deploy-agent-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agent-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: lk agent deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          echo "$HOME/.livekit/bin" >> "$GITHUB_PATH"
          # Fallback: some installers drop the binary into /usr/local/bin.
          which lk || true

      - name: Verify LiveKit CLI
        run: lk --version

      - name: Register LiveKit project
        working-directory: agent-worker
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -eu
          # `lk agent deploy` needs a registered project in ~/.livekit/cli-config.yaml.
          # In CI there is no interactive `lk cloud auth`, so register one from secrets
          # and mark it default. Do not echo the api key / secret.
          #
          # `lk project add` in non-interactive mode (no TTY) requires ALL of:
          # PROJECT_NAME positional arg + --url + --api-key + --api-secret. If any
          # is empty it aborts with "non-interactive mode: provide project name as
          # argument and --url, --api-key, --api-secret". Validate presence first
          # so a missing GitHub secret produces an obvious error, not a cryptic one.
          missing=""
          [ -n "${LIVEKIT_URL:-}" ]        || missing="$missing LIVEKIT_URL"
          [ -n "${LIVEKIT_API_KEY:-}" ]    || missing="$missing LIVEKIT_API_KEY"
          [ -n "${LIVEKIT_API_SECRET:-}" ] || missing="$missing LIVEKIT_API_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            exit 1
          fi
          # Pass --yes to explicitly opt into non-interactive mode (belt & braces
          # CI stdin is not a TTY, so SkipPrompts() is already true; no --yes needed.
          lk project add ci-project \

            --url "$LIVEKIT_URL" \
            --api-key "$LIVEKIT_API_KEY" \
            --api-secret "$LIVEKIT_API_SECRET" \
            --default


      - name: Resolve existing agent id (if any)
        id: resolve
        working-directory: agent-worker
        run: |
          set -euo pipefail
          # `lk agent deploy` requires an agent id, either passed via --id or
          # stored in livekit.toml. The committed livekit.toml intentionally
          # has no id (the id is minted by LiveKit Cloud on first create), so
          # in CI we discover it from `lk agent list` on every run.
          LIST_OUT="$(lk agent list 2>&1 || true)"
          printf '%s\n' "$LIST_OUT"
          # Agent IDs are printed as CA_<opaque>. Grab the first one, if any.
          AGENT_ID="$(printf '%s\n' "$LIST_OUT" | grep -oE 'CA_[A-Za-z0-9_-]+' | head -n1 || true)"
          if [ -n "$AGENT_ID" ]; then
            echo "Found existing agent: $AGENT_ID"
          else
            echo "No existing agent found in this project."
          fi
          echo "agent_id=$AGENT_ID" >> "$GITHUB_OUTPUT"

      - name: Create agent (first deploy only)
        if: steps.resolve.outputs.agent_id == ''
        working-directory: agent-worker
        run: |
          # First-time deploy: register the agent in LiveKit Cloud. This builds
          # the Dockerfile in agent-worker/ and mints a new agent id. Runtime
          # secrets (OPENAI_REALTIME_API_KEY etc.) must be set separately in
          # the LiveKit Cloud dashboard or via `lk agent update-secrets`.
          lk agent create .

      - name: Deploy agent-worker to LiveKit Cloud
        if: steps.resolve.outputs.agent_id != ''
        working-directory: agent-worker
        run: |
          # Redeploy an existing agent. The id is passed explicitly because
          # the committed livekit.toml does not contain one.
          lk agent deploy --id "${{ steps.resolve.outputs.agent_id }}" .

      - name: Report agent status
        if: always()
        working-directory: agent-worker
        run: lk agent list || true

