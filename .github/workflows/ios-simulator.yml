# Unsigned iOS simulator build of the RestPilot app shell in ios-app/.
#
# ios-app/ is the Capacitor 6 project generated by White Glove Treatment
# (amberai src/lib/api-v1/ios-build, dry-run, GitHub provider). The steps below
# are its GitHub fallback "simulator" lane, pointed at ios-app/.
#
# No signing, no secrets, no Apple account, nothing uploaded anywhere but this
# run's artifacts. GitHub-hosted macOS runners are free for public repositories;
# if this repository is ever made private, disable this workflow first.
name: iOS simulator build (unsigned)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-simulator.yml"
permissions:
  contents: read
concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    # Free only while the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    env:
      CM_BUILD_DIR: ${{ github.workspace }}/ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator without signing
        run: |
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/wgt-artifacts"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/derived" CODE_SIGNING_ALLOWED=NO build \
            | tee "$CM_BUILD_DIR/wgt-artifacts/xcodebuild-simulator.log"
      - name: Boot simulator, install, launch, screenshot
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$CM_BUILD_DIR/build/derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP_PATH" ] || { echo "No .app was produced"; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          # Newest iOS runtime, and an iPhone that runtime supports. Picking the newest
          # device type on its own can name a phone the runtime cannot boot ("Incompatible device").
          read -r RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS")][-1]; print(r["identifier"], [d["identifier"] for d in r["supportedDeviceTypes"] if d.get("productFamily") == "iPhone"][-1])')
          [ -n "$RUNTIME" ] && [ -n "$DEVICE_TYPE" ] || { echo "No iOS simulator runtime with an iPhone was found"; exit 1; }
          echo "Simulator: $DEVICE_TYPE on $RUNTIME"
          DEVICE=$(xcrun simctl create WGTCheck "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 20
          mkdir -p "$CM_BUILD_DIR/wgt-artifacts"
          xcrun simctl io "$DEVICE" screenshot "$CM_BUILD_DIR/wgt-artifacts/simulator-launch.png"
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "App"' > "$CM_BUILD_DIR/wgt-artifacts/simulator-app.log" || true
          xcrun simctl shutdown "$DEVICE" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restpilot-ios-simulator-evidence
          path: ios-app/wgt-artifacts
          retention-days: 7
          if-no-files-found: warn
