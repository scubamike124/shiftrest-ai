# End-to-end check of the RestPilot app shell's NATIVE features in the iOS
# simulator: the site's own native code (src/lib/native) against the real
# Capacitor plugins, real iOS permission alerts and real notification banners.
#
#   Phase A  the shell loads a CI-only test page instead of restpilotai.com.
#            The page bundles src/lib/native and: asks for notification
#            permission (the UI test taps Allow), schedules the planned
#            reminders, re-plans, clears, and saves an offline plan. The UI test
#            then waits for a scheduled notification banner and taps it.
#   Phase H  a separate CI test app writes a known night into the simulator's
#            Health store; the shell's test page connects through the read-only
#            RestPilotHealth plugin (the UI test taps through Apple's Health
#            sheet) and checks the mapped night value by value, then Disconnect.
#   Phase B  the same app, pointed at a host that cannot resolve, must show the
#            offline screen (ios-app/www/offline.html) with the saved plan.
#   Phase U  a copy pointed at a tiny HTTP server on the runner's loopback: the
#            WebView's page request and a fetch() from the page must both send
#            a User-Agent ending in " RestPilotApp/<version>" (appendUserAgent).
#            The server and site use that token to recognise the app.
#
# Simulator only: ad-hoc signed ("-"), no Apple account, no secrets, nothing
# uploaded except this run's evidence. GitHub's macOS runners are free for
# public repositories; the job refuses to run if the repository is private.
name: iOS native end-to-end (simulator)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios-app/**"
      - "ios-e2e/**"
      - "src/lib/native/**"
      - "src/lib/native-app.ts"
      - "src/lib/health/**"
      - "src/components/native/**"
      - "src/components/NotificationsSection.tsx"
      - "src/routes/__root.tsx"
      - "tests/native-*.test.mjs"
      - "tests/apple-health.test.mjs"
      - "src/hooks/use-apple-health.ts"
      - ".github/workflows/ios-native-e2e.yml"
permissions:
  contents: read
concurrency:
  group: ios-native-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 50
    env:
      EV: ${{ github.workspace }}/e2e-evidence
      DERIVED: ${{ github.workspace }}/build/derived
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (site, for the test page bundle; shell)
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          (cd ios-app && npm ci --no-audit --no-fund)
          mkdir -p "$EV"
      - name: Typecheck the site
        run: npx tsc --noEmit
      - name: Unit tests for the native planner and helpers
        run: node --test tests/native-*.test.mjs tests/apple-health.test.mjs
      - name: Swap in the CI test page (never shipped)
        run: |
          set -euo pipefail
          npx esbuild ios-e2e/page/e2e.ts --bundle --format=iife --platform=browser --target=safari15 \
            --alias:@=./src --outfile=ios-app/www/e2e.js
          cp ios-e2e/page/index.html ios-app/www/index.html
          python3 - <<'EOF'
          import json
          p = "ios-app/capacitor.config.json"
          c = json.load(open(p))
          c["server"].pop("url")  # load the local test page, keep errorPath
          json.dump(c, open(p, "w"), indent=2)
          EOF
          cat ios-app/capacitor.config.json
      - name: Sync and build the shell for the simulator (ad-hoc signed)
        working-directory: ios-app
        run: |
          set -o pipefail
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES build \
            | tee "$EV/xcodebuild-shell.log" | grep -E "error:|warning: .*entitlement|BUILD (SUCCEEDED|FAILED)" || true
          test -d "$DERIVED/Build/Products/Debug-iphonesimulator/App.app"
          # Evidence: the entitlements actually signed into the shell (HealthKit).
          codesign -d --entitlements :- "$DERIVED/Build/Products/Debug-iphonesimulator/App.app" > "$EV/shell-entitlements.plist" 2>&1 || true
          cat "$EV/shell-entitlements.plist"
      - name: Generate and build the UI test harness
        working-directory: ios-e2e
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null
          xcodegen generate
      - name: Boot a simulator and install the shell
        shell: bash
        run: |
          set -euo pipefail
          read -r RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS")]; ds=[d["identifier"] for d in (rs[-1].get("supportedDeviceTypes") or []) if d.get("productFamily") == "iPhone"] if rs else []; print(rs[-1]["identifier"], ds[-1]) if ds else print()') || true
          [ -n "${RUNTIME:-}" ] && [ -n "${DEVICE_TYPE:-}" ] || { echo "No iOS simulator runtime with an iPhone"; exit 1; }
          DEVICE=$(xcrun simctl create RPNativeE2E "$DEVICE_TYPE" "$RUNTIME")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "Simulator: $DEVICE_TYPE on $RUNTIME" | tee "$EV/simulator.txt"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$DERIVED/Build/Products/Debug-iphonesimulator/App.app"
      - name: "Phase A: site code drives the real plugins"
        working-directory: ios-e2e
        run: |
          set -o pipefail
          xcodebuild test -project E2E.xcodeproj -scheme E2E -destination "id=$DEVICE" \
            -resultBundlePath "$EV/phase-a.xcresult" \
            -only-testing:E2EUITests/ShellE2ETests/testA_siteCodeDrivesRealPlugins \
            | tee "$EV/phase-a.log" | grep -E "Test Case|error:|XCTAssert|TEST (SUCCEEDED|FAILED)"
      - name: "Phase H: install a copy whose page runs the Apple Health check"
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AppHealth.app"
          rm -rf "$APP"; cp -R "$DERIVED/Build/Products/Debug-iphonesimulator/App.app" "$APP"
          sed -i '' 's/data-mode="native"/data-mode="health"/' "$APP/public/index.html"
          grep -q 'data-mode="health"' "$APP/public/index.html"
          # Simulator entitlements live in the binary's __entitlements section; re-signing keeps them.
          codesign --force --sign - "$APP"
          xcrun simctl install "$DEVICE" "$APP"
      - name: "Phase H: Apple Health written by a test app, read by the shell"
        working-directory: ios-e2e
        run: |
          set -o pipefail
          xcodebuild test -project E2E.xcodeproj -scheme E2E -destination "id=$DEVICE" \
            -resultBundlePath "$EV/phase-h.xcresult" \
            -only-testing:E2EUITests/ShellE2ETests/testC_appleHealthThroughTheShell \
            | tee "$EV/phase-h.log" | grep -E "Test Case|error:|XCTAssert|TEST (SUCCEEDED|FAILED)"
      - name: "Phase B: point the same app at an unreachable host"
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.app"
          rm -rf "$APP"; cp -R "$DERIVED/Build/Products/Debug-iphonesimulator/App.app" "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/ent.plist" 2>/dev/null || true
          python3 - "$APP/capacitor.config.json" <<'EOF'
          import json, sys
          p = sys.argv[1]; c = json.load(open(p))
          c["server"]["url"] = "https://offline.invalid/"
          json.dump(c, open(p, "w"))
          EOF
          if [ -s "$RUNNER_TEMP/ent.plist" ]; then
            codesign --force --sign - --entitlements "$RUNNER_TEMP/ent.plist" "$APP"
          else
            codesign --force --sign - "$APP"
          fi
          # Reinstalling keeps the app's data container: the plan saved in phase A stays.
          xcrun simctl install "$DEVICE" "$APP"
      - name: "Phase B: offline screen with the saved plan"
        working-directory: ios-e2e
        run: |
          set -o pipefail
          xcodebuild test -project E2E.xcodeproj -scheme E2E -destination "id=$DEVICE" \
            -resultBundlePath "$EV/phase-b.xcresult" \
            -only-testing:E2EUITests/ShellE2ETests/testB_offlineScreenShowsSavedPlan \
            | tee "$EV/phase-b.log" | grep -E "Test Case|error:|XCTAssert|TEST (SUCCEEDED|FAILED)"
      - name: "Phase U: the WebView's HTTP requests carry RestPilotApp/<version>"
        shell: bash
        run: |
          set -euo pipefail
          # Keep phase B's offline screen as evidence before this phase replaces it.
          xcrun simctl io "$DEVICE" screenshot "$EV/phase-b-offline.png" || true
          EXPECT=$(python3 -c 'import json; print(json.load(open("ios-app/capacitor.config.json"))["appendUserAgent"])')
          echo "Expected user-agent suffix: $EXPECT"
          # A tiny server on the runner's loopback (the simulator shares it)
          # records the User-Agent header of every request. Its page also
          # makes a fetch(), like the site's server-function calls.
          LOG="$EV/phase-u-requests.tsv"; : > "$LOG"
          cat > "$RUNNER_TEMP/ua-server.py" <<'EOF'
          import http.server, sys
          log = open(sys.argv[1], "a", buffering=1)
          PAGE = (b"<!doctype html><meta name=viewport content='width=device-width'>"
                  b"<h1 id=t>User-agent check</h1>"
                  b"<script>fetch('/fetch-check').then(()=>{document.getElementById('t').textContent='User-agent check: fetch sent'})</script>")
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  log.write(self.path + "\t" + self.headers.get("User-Agent", "") + "\n")
                  body = PAGE if self.path == "/" else b"ok"
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html" if self.path == "/" else "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          http.server.ThreadingHTTPServer(("127.0.0.1", 8765), H).serve_forever()
          EOF
          python3 "$RUNNER_TEMP/ua-server.py" "$LOG" &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # CI-only copy (never shipped): load the local server instead of
          # restpilotai.com, and allow plain HTTP for it. appendUserAgent is
          # left exactly as built.
          APP="$RUNNER_TEMP/AppUA.app"
          rm -rf "$APP"; cp -R "$DERIVED/Build/Products/Debug-iphonesimulator/App.app" "$APP"
          python3 - "$APP/capacitor.config.json" "$EXPECT" <<'EOF'
          import json, sys
          p = sys.argv[1]; c = json.load(open(p))
          assert c.get("appendUserAgent") == sys.argv[2], c.get("appendUserAgent")
          c["server"]["url"] = "http://127.0.0.1:8765/"
          json.dump(c, open(p, "w"))
          EOF
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}' "$APP/Info.plist"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/ent-ua.plist" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/ent-ua.plist" ]; then
            codesign --force --sign - --entitlements "$RUNNER_TEMP/ent-ua.plist" "$APP"
          else
            codesign --force --sign - "$APP"
          fi
          xcrun simctl terminate "$DEVICE" com.restpilotai.app 2>/dev/null || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.restpilotai.app
          for _ in $(seq 1 60); do
            grep -q "^/fetch-check" "$LOG" && break
            sleep 1
          done
          sleep 2
          xcrun simctl io "$DEVICE" screenshot "$EV/phase-u.png" || true
          echo "Requests seen by the server (path, User-Agent):"
          cat "$LOG"
          python3 - "$LOG" "$EXPECT" <<'EOF'
          import sys
          rows = [l.rstrip("\n").split("\t", 1) for l in open(sys.argv[1]) if "\t" in l]
          want = " " + sys.argv[2]
          seen = {path: ua for path, ua in rows}
          for path, what in (("/", "page load"), ("/fetch-check", "fetch() from the page")):
              ua = seen.get(path)
              assert ua is not None, f"no {what} request reached the server"
              assert ua.endswith(want), f"{what} User-Agent lacks {want!r}: {ua!r}"
              print(f"OK {what}: User-Agent ends with {want.strip()!r}")
          EOF
      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set +e
          [ -n "${DEVICE:-}" ] || exit 0
          xcrun simctl io "$DEVICE" screenshot "$EV/final-screen.png"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.restpilotai.app data 2>/dev/null)
          [ -n "$DATA" ] && plutil -p "$DATA/Library/Preferences/com.restpilotai.app.plist" > "$EV/shell-userdefaults.txt" 2>&1
          for r in phase-a phase-h phase-b; do
            [ -d "$EV/$r.xcresult" ] && xcrun xcresulttool export attachments --path "$EV/$r.xcresult" --output-path "$EV/$r-attachments" >/dev/null 2>&1
          done
          xcrun simctl spawn "$DEVICE" log show --last 15m --style compact --predicate 'process == "App"' > "$EV/shell-app.log" 2>/dev/null
          ls -R "$EV" | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restpilot-ios-native-e2e-evidence
          path: e2e-evidence
          retention-days: 14
          if-no-files-found: warn
