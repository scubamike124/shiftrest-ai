# Promptfoo AI evals for the RestPilot companion.
#
# Cases, production-prompt assembly, providers and the judge come from the AI
# companion benchmark (tests/ai/companion, PR #18). tests/ai/run-evals.mjs adds
# the spend controls: every model and judge call goes through
# tests/ai/companion/lib/guard.cjs (hard token cap + response cache).
#
# On PRs that touch AI code or the evals:
#   1. offline self-test, $0: all 134 cases assembled by the production prompt
#      code and checked for the DATA HONESTY guardrail (no key, no network);
#   2. smoke: 10 cases (one per area) on the current model, cached, 120k cap.
# Manual / qa-full: full suite (1.5M cap) or consistency repeats.
# Model comparison stays in tests/ai/companion/run.mjs (also capped).
#
# Needs secrets: GEMINI_API_KEY (current model; Google AI Studio) and one judge
# key (OPENAI_API_KEY, ANTHROPIC_API_KEY or GEMINI_API_KEY). Without them the
# smoke step reports BLOCKED in the job summary, never a pass.
name: AI evals (Promptfoo)
on:
  pull_request:
    paths:
      - "src/lib/ai/**"
      - "src/lib/schedule*.ts"
      - "src/lib/time/**"
      - "src/routes/api/ai.ts"
      - "src/routes/api/coach.ts"
      - "src/routes/api/brief.ts"
      - "src/routes/api/insights.ts"
      - "tests/ai/**"
      - "tests/ai-*.test.mjs"
      - ".github/workflows/ai-evals.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke | full | consistency"
        required: true
        default: smoke
        type: choice
        options: [smoke, full, consistency]
      max_tokens:
        description: "Hard token cap for this run (blank = mode default)"
        required: false
        default: ""
  workflow_call:
    inputs:
      mode:
        type: string
        default: full
      max_tokens:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ai-evals-${{ github.ref }}-${{ inputs.mode || 'smoke' }}
  cancel-in-progress: true
jobs:
  promptfoo:
    name: AI evals (Promptfoo ${{ inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BENCH_JUDGE: ${{ vars.BENCH_JUDGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Spend-guard and assertion unit tests
        run: node --test tests/ai-eval-guard.test.mjs tests/ai-companion-assertions.test.mjs
      - name: Restore response cache
        uses: actions/cache/restore@v4
        with:
          path: tests/ai/.cache
          key: ai-evals-v2-${{ github.run_id }}
          restore-keys: ai-evals-v2-
      - name: Offline self-test ($0, all cases)
        run: node tests/ai/run-evals.mjs --offline --out tests/ai/.results/offline
      - name: Run evals (capped)
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'smoke' }}
          CAP: ${{ inputs.max_tokens }}
        run: |
          [[ -z "$CAP" || "$CAP" =~ ^[0-9]+$ ]] || { echo "max_tokens must be a number"; exit 1; }
          case "$MODE" in
            smoke)       ARGS="--smoke";               CAP="${CAP:-120000}" ;;
            full)        ARGS="";                      CAP="${CAP:-1500000}" ;;
            consistency) ARGS="--repeat 3 --no-cache"; CAP="${CAP:-3000000}" ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
          node tests/ai/run-evals.mjs $ARGS --max-tokens "$CAP" --out "tests/ai/.results/$MODE"
      - name: Save response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/ai/.cache
          key: ai-evals-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-results-${{ inputs.mode || 'smoke' }}
          path: tests/ai/.results
          retention-days: 14
          if-no-files-found: warn
